name: e_comm
description: "E-Com Shopping Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/categories/
    - assets/icon/
    - assets/profile/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Mahek.jpg"
  min_sdk_android: 21